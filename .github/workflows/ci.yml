name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: be
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: kateringkita_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      NODE_ENV: test
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/kateringkita_test
      TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306/kateringkita_test
      JWT_SECRET: ci-secret-yang-panjangnya-minimal-32-karakter
      CORS_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
        with:
          path: be
      # test/merchant-orders-wa.test.ts membaca ../fe/lib/wa-template.ts
      - uses: actions/checkout@v4
        with:
          repository: stanlevv/kateringkita-frontend
          path: fe
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: be/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run migrate
      - run: npm test
